; NULD - configuração, lida ao iniciar

[ui]
; Idioma da interface: pt-BR = português brasileiro, es = espanhol, en = inglês
idioma = pt-BR

[juegos]
; Origem dos jogos PS2 (pastas DVD e CD), separada por vírgulas: usb, hdd, mx4sio, ilink, mmce,
; udpbd, udpfs. hdd aceita exFAT ou APA com HD Loader. udpbd usa o IP fixo em [red].
; MX4SIO e MMCE não funcionam juntos. Configurações, capas, Neutrino, POPS e APPS ficam no USB.
origen = usb
; IP do servidor com nuld_catalog. Vazio: servidor UDPFS comum, IP fixo em [red], sem capas/conquistas online.
servidor =

[memorycard]
; juego = virtual por jogo (VMC/<serial>.bin); compartida = virtual compartilhado (VMC/NULD.bin);
; fisica = memory card no slot 1. Triângulo altera por jogo. HD Loader exige físico; MMCE troca automaticamente.
modo = juego

[video]
; Modo dos jogos: nativo, 480p ou 1080i. Triângulo altera por jogo.
modo = 480p
; Menu: 720p ou 480i (TV de tubo). L2+R2 alterna e salva. Em 480i, jogos usam nativo por padrão.
pantalla = 720p

[sonido]
; Volume dos sons do menu: 0-100
volumen = 100

[red]
; dhcp ou IP fixo. mascara = máscara, puerta = gateway. DNS também funciona com DHCP.
ip = dhcp
mascara = 255.255.255.0
puerta =
dns =

[portadas]
; si = baixar capas ausentes do GitHub xlenore/ps2-covers, com cabo de rede conectado
descargar = si

[actualizaciones]
; no = manter a versão traduzida. O atualizador original instala a versão oficial, sem esta tradução.
buscar = no

[logros]
; RetroAchievements: si = consultar cliente xeRAbora na rede; no = desativar
activos = si
; IP do cliente; vazio = procurar na rede
servidor =

[jellyfin]
; Servidor Jellyfin (http://IP:8096), usuário e senha. Vazio = desativado.
servidor =
usuario =
clave =
; Idiomas das legendas em ordem de preferência; no = sem legendas. Quadrado troca a faixa.
subtitulos = por

[igr]
; Menu pausa o jogo; reiniciar reinicia o console; apagar desliga. Requer Neutrino compilado deste fork.
; FMCB pode iniciar mc?:/BOOT/NULD.ELF automaticamente (instalado pelo launcher).
; Botões aceitos: L1 L2 R1 R2 L3 R3 START SELECT UP DOWN LEFT RIGHT TRIANGLE CIRCLE X SQUARE.
; Combine com +; vazio = desativado. As chaves permanecem no formato original por compatibilidade.
menu = L1+L2+R1+R2+START+SELECT
reiniciar =
apagar = L1+L2+R1+R2+L3+R3
